name: Final Exam CI/CD

on:
  push:
    branches:
      - final-exam-submission

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint stage (flake8)
        run: flake8 src/

      - name: Security stage (bandit)
        run: bandit -r src/ -s B101,B105

      - name: Test stage (pytest with coverage)
        run: pytest --cov=src/ --cov-fail-under=85